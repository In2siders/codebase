version: '3.8'

services:
  frontend:
    image: ghcr.io/in2siders/frontend-web:latest
    container_name: in2siders-frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=${BACKEND_URL:-http://localhost:4000}
      - NODE_ENV=${NODE_ENV:-production}
    depends_on:
      - backend
    networks:
      - in2siders-network
    restart: unless-stopped

  backend:
    image: ghcr.io/in2siders/backend:latest
    container_name: in2siders-backend
    ports:
      - "4000:4000"
    environment:
      - PORT=${BACKEND_PORT:-4000}
      - NODE_ENV=${NODE_ENV:-production}
      - DATABASE_TYPE=postgres
      - DATABASE_HOST=database
      - DATABASE_PORT=5432
      - DATABASE_NAME=${POSTGRES_DB:-in2siders}
      - DATABASE_USER=${POSTGRES_USER:-in2siders}
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD:-in2siders}
    depends_on:
      database:
        condition: service_healthy
    networks:
      - in2siders-network
    restart: unless-stopped

  database:
    image: postgres:15-alpine
    container_name: in2siders-database
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-in2siders}
      - POSTGRES_USER=${POSTGRES_USER:-in2siders}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-in2siders}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - in2siders-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-in2siders}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

networks:
  in2siders-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local
